name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Restore RDF test caches
        uses: actions/cache@v4
        with:
          path: |
            .cache/mobibench
            .cache/owl2rl
          key: rdf-test-caches-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            rdf-test-caches-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run example tests
        run: npm run test:examples

      - name: Run rule profile tests
        run: npm test
